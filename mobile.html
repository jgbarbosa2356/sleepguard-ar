<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SleepGuard Mobile</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js"></script></head><body class="mobile-body"><main class="mobile-card"><span class="eyebrow">SLEEPGUARD MOBILE</span><h1>Celular conectado<br>ao <i>SleepGuard</i></h1><p id="mobileStatus" class="notice">Preparando conexão…</p><label>Tipo de alerta<select id="alertType"><option value="bip">Bip padrão</option><option value="speech">Mensagem falada</option><option value="recording">Áudio gravado</option><option value="upload">Enviar MP3, WAV ou M4A</option></select></label><div id="speechControls"><label>Mensagem falada<input id="speechText" value="Atenção! Seus olhos ficaram fechados."></label></div><div id="recordControls" class="hidden"><div class="actions"><button id="recordBtn" class="primary">● Gravar alerta</button><button id="stopRecordBtn" class="secondary" disabled>■ Parar e salvar</button></div><audio id="recordedAudio" controls></audio><div class="actions"><button id="playRecordBtn" class="outline">Ouvir gravação</button><button id="deleteRecordBtn" class="danger">Excluir gravação</button></div></div><div id="uploadControls" class="hidden"><label>Arquivo de áudio<input id="audioFile" accept="audio/mpeg,audio/wav,audio/x-m4a,audio/mp4" type="file"></label><audio id="uploadedAudio" controls></audio></div><div class="actions vertical"><button id="testBtn" class="outline">Testar alerta</button><button id="activateBtn" class="primary">Ativar alertas no celular</button></div><p class="muted">A reprodução em segundo plano ou com a tela bloqueada depende das regras do navegador e do sistema operacional.</p></main><script src="js/realtime.js"></script><script src="js/app.js"></script></body></html>
